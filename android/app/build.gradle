plugins { id 'com.android.application' }

// Proof of concept: the native libraries come prebuilt (android/build-all.ps1): libSDL3.so and libmain.so from
// build/android-rt (CMake, android/CMakeLists.txt), libgame.so from build/android-game (android/gamelib_ninja.py).
android {
    namespace "com.jay.plarecomp"
    compileSdk 35
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.jay.plarecomp"
        minSdkVersion 33
        targetSdkVersion 35
        versionCode 1
        versionName "0.1-poc"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    packagingOptions { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
    if (providers.gradleProperty("withoutGame").isPresent()) {
        packagingOptions.jniLibs.excludes += ['**/libgame.so']
        defaultConfig.applicationIdSuffix ".importer"
    }
    sourceSets {
        main { java.srcDirs = ['src/main/java', '../../third_party/SDL3/android-project/app/src/main/java'] }
    }
}
